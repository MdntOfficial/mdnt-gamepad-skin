<!doctype html><html lang="en"><meta charset="utf-8"><title>MDNT Official — Controller Skin Preview</title><link rel="stylesheet" href="style.css"><style>
*{box-sizing:border-box}body{margin:0;background:#10151f;color:#dce7f5;font-family:Arial,sans-serif}header{padding:30px 40px 10px}h1{font-size:24px;margin:0 0 10px}p{color:#a8b8ca;font-size:14px}button{background:#1d2939;border:1px solid #42546b;color:#e8f3ff;padding:10px 18px;border-radius:6px;cursor:pointer;margin-right:10px}button.active{border-color:#21d4e8}#stage{width:886px;height:670px;position:relative;margin:auto}.controller.ds4.edit{position:absolute;left:40px;top:20px!important}.label{position:absolute;bottom:12px;left:40px;color:#7f94ac;font-size:12px}
</style><header><h1>MDNT_OFFICIAL / Controller</h1><p>Distressed silver and black · cyan and magenta graffiti · MDNT crown</p><button id="idle" class="active">Idle</button><button id="pressed">Pressed inputs</button><button id="motion">Move sticks</button></header><div id="stage"><div class="controller ds4 edit">
<div class="triggers"><div class="trigger left"></div><div class="trigger right"></div></div><div class="bumpers"><div class="bumper left"></div><div class="bumper right"></div></div><div class="touchpad"></div><div class="arrows"><div class="back"></div><div class="start"></div></div><div class="abxy"><div class="button a"></div><div class="button b"></div><div class="button x"></div><div class="button y"></div></div><div class="sticks"><div class="stick left"></div><div class="stick right"></div></div><div class="dpad"><div class="face up"></div><div class="face down"></div><div class="face left"></div><div class="face right"></div></div></div><span class="label">Visual simulation — live controller input is handled by GamePad Viewer.</span></div><script>
const inputs=[...document.querySelectorAll('.button,.face,.stick,.bumper,.trigger,.touchpad,.back,.start')];let timer;
function state(mode){clearInterval(timer);inputs.forEach(x=>{x.classList.toggle('pressed',mode==='pressed');x.style.transform='';x.style.marginLeft='';x.style.marginTop='';x.style.opacity=''});document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.id===mode));if(mode==='motion'){let t=0;timer=setInterval(()=>{t+=.07;const l=document.querySelector('.stick.left'),r=document.querySelector('.stick.right');l.style.marginLeft=Math.cos(t)*22+'px';l.style.marginTop=Math.sin(t)*22+'px';r.style.marginLeft=Math.sin(t)*22+'px';r.style.marginTop=Math.cos(t)*22+'px'},16)}}
document.querySelectorAll('button').forEach(x=>x.onclick=()=>state(x.id));
</script></html>
